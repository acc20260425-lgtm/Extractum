name: Rust Full

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-full:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          cache: npm
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: "./src-tauri -> target"
      - uses: ./.github/actions/setup-cargo-deny
      - run: npm.cmd ci
      - run: npm.cmd run bootstrap:testing
      - run: node_modules\.bin\playwright.cmd install chromium
      - run: npm.cmd run check:rust:fast
      - run: npm.cmd run check:rust:duplicates
      - run: npm.cmd run verify
      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
      - name: Upload Playwright results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: playwright-results
          path: artifacts/playwright-results.json
          if-no-files-found: ignore
